# Конфигурация мониторируемых сайтов.
#   domain             — домен сайта (обязателен, без https://)
#   metrika_counter_id — ID счётчика Яндекс.Метрики (ЭПИК-2)
#   webmaster_host_id  — host_id Яндекс.Вебмастера (ЭПИК-5)
#   node_exporter_url  — URL node_exporter сервера сайта (ЭПИК-6)
#   metrics_urls       — эндпоинты метрик сайта за X-Monitoring-Key (ЭПИК-9, ADR-007);
#                        ключ — SITE_METRICS_API_KEY в .env
sites:
  # Пример с Метрикой (ЭПИК-2):
  # - domain: example.com
  #   metrika_counter_id: 12345678
  # Пример с Вебмастером (ЭПИК-5): host_id из API Вебмастера (GET /v4/user/{uid}/hosts)
  # - domain: example.com
  #   webmaster_host_id: "https:example.com:443"
  # Пример с серверными метриками (ЭПИК-6): URL node_exporter сервера сайта
  # - domain: example.com
  #   node_exporter_url: http://203.0.113.10:9100
  # Пример с метриками за ключом (ЭПИК-9):
  # - domain: example.com
  #   metrics_urls:
  #     tracking: https://example.com/metrics/tracking
  #     content: https://example.com/metrics/content
  #     node: https://example.com/metrics/node
  #     postgres: https://example.com/metrics/postgres
  - domain: example.com
  - domain: example.org
  - domain: da-dryclean.ru
    webmaster_host_id: "https:da-dryclean.ru:443"
    metrics_urls:
      tracking: https://da-dryclean.ru/metrics/tracking
      content: https://da-dryclean.ru/metrics/content
      node: https://da-dryclean.ru/metrics/node
      postgres: https://da-dryclean.ru/metrics/postgres
  # Эвакуация.online (ЧТЗ_Подключение_эвакуация_online v1.1):
  # ключ X-Monitoring-Key — персайтный, в .env (SITE_METRICS_API_KEYS, ADR-010).
  # Вебмастер — после готовности site-metrics на стороне сайта (решение владельца).
  - domain: эвакуация.online
    metrika_counter_id: 111456265
    # host_id из API Вебмастера аккаунта владельца (uid 1145135652),
    # punycode-форма — как верифицирован хост в Яндексе
    webmaster_host_id: "https:xn--80aae0ai8cwa4cza.online:443"
    metrics_urls:
      tracking: https://эвакуация.online/metrics/tracking
      content: https://эвакуация.online/metrics/content
      node: https://эвакуация.online/metrics/node
      postgres: https://эвакуация.online/metrics/postgres
