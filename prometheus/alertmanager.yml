# Шаблон конфига Alertmanager (ЭПИК-7, ADR-006 §2–3).
# Плейсхолдеры __TELEGRAM_BOT_TOKEN__ / __TELEGRAM_CHAT_ID__ подставляются
# alertmanager-entrypoint.sh из env (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).
# Значения секретов живут ТОЛЬКО в .env (chmod 600), никогда в git.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, site]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

inhibit_rules:
  # critical SSL глушит warning того же сайта (ADR-006 §2)
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, site]
  # лежащий сайт глушит шум трафика/коллекторов по тому же сайту
  - source_matchers:
      - alertname = "SiteDown"
    target_matchers:
      - alertname =~ "SiteTrafficDrop|CollectorFailing"
    equal: [site]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        message: >-
          {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }}
          {{ .CommonLabels.alertname }}{{ if .CommonLabels.site }}
          ({{ .CommonLabels.site }}){{ end }}{{ "\n" }}{{ range .Alerts }}
          {{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}
