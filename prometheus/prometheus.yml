global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ADR-008: ретеншн по РАЗМЕРУ (не по времени). В Prometheus 3.14
# BeyondTimeRetention сравнивает даты блоков (в микросекундах) с
# retentionDuration (в миллисекундах) → эффективный срок хранения в 1000 раз
# меньше заданного и backfill-блоки удалялись при старте как "obsolete".
# Отключение time-ретеншна (RetentionDuration=0) и большой лимит по размеру
# полностью обходят баг; наши блоки крошечные (ЧТЗ_Вебмастер_Backfill_по_дням).
storage:
  tsdb:
    retention:
      size: 20GB
    # ADR-012: приём событийных метрик сайта с ЯВНЫМИ timestamp'ами
    # (business_phone_clicks_event, окно рендера 24ч). Повторная выдача
    # семплов на каждом скрейпе — дубликаты; окно OOO ≥ окна рендера
    # даёт молчаливую дедупликацию (ts+value совпадают) и приём новых
    # событий внутри окна. Прочие метрики (без явных ts) не затронуты.
    out_of_order_time_window: 25h

rule_files:
  # ЭПИК-7: правила алертов (ADR-006)
  - /etc/prometheus/alerts.yml

alerting:
  # ЭПИК-7: firing-алерты уходят в Alertmanager (доставка в Telegram)
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: monitoring-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8088

  # ЭПИК-6: цели node_exporter берутся из config/sites.yml (поле
  # node_exporter_url) через HTTP SD приложения; refresh 60s — правка
  # sites.yml подхватывается без рестарта Prometheus (ADR-005).
  - job_name: node-exporter
    http_sd_configs:
      - url: http://app:8088/api/v1/sd/node-exporter
        refresh_interval: 60s

  # ЭПИК-9 (ADR-010): метрики сайтов через relay приложения (app:8088).
  # Цели — из поля metrics_urls в config/sites.yml (HTTP SD, refresh 60s);
  # ключ X-Monitoring-Key сайта подставляет relay — Prometheus скрейпит
  # без секретов. scrape_timeout 12s — запас поверх таймаута relay (10s).
  - job_name: site-tracking
    scrape_timeout: 12s
    http_sd_configs:
      - url: http://app:8088/api/v1/sd/site-metrics/tracking
        refresh_interval: 60s

  - job_name: site-content
    scrape_timeout: 12s
    http_sd_configs:
      - url: http://app:8088/api/v1/sd/site-metrics/content
        refresh_interval: 60s

  - job_name: site-node
    scrape_timeout: 12s
    http_sd_configs:
      - url: http://app:8088/api/v1/sd/site-metrics/node
        refresh_interval: 60s

  - job_name: site-postgres
    scrape_timeout: 12s
    http_sd_configs:
      - url: http://app:8088/api/v1/sd/site-metrics/postgres
        refresh_interval: 60s
