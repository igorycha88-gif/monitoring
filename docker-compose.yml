name: monitoring

services:
  app:
    build: .
    container_name: monitoring-app
    restart: unless-stopped
    env_file: .env
    # ADR-009: долговременное хранение данных Вебмастера (SQLite в volume)
    environment:
      WEBMASTER_DB_PATH: ${WEBMASTER_DB_PATH:-/var/lib/monitoring/webmaster.db}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./config:/srv/config:ro
      - monitoring-db:/var/lib/monitoring
    networks:
      - monitoring-net

  # Инфра-пробел (ЧТЗ_Инфра_DevDeps_И_Хост_Тулчейн): dev-контейнер для прогона
  # pytest/mypy/ruff ВНУТРИ образа. Под profile `dev` — не стартует в обычном `up`.
  #   docker compose -p monitoring --profile dev run --rm app-dev pytest
  #   docker compose -p monitoring --profile dev run --rm app-dev mypy .
  #   docker compose -p monitoring --profile dev run --rm app-dev ruff check .
  app-dev:
    build:
      context: .
      target: dev
    image: monitoring-dev
    container_name: monitoring-app-dev
    profiles: ["dev"]
    env_file: .env
    environment:
      WEBMASTER_DB_PATH: ${WEBMASTER_DB_PATH:-/var/lib/monitoring/webmaster.db}
    volumes:
      - ./config:/srv/config:ro
      - ./tests:/srv/tests:ro
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    # Флаги (retention 400d — ADR-008) задаёт prometheus-entrypoint.sh;
    # здесь command НЕ дублируется (повтор флага = crash Prometheus).
    # ADR-010: скрейпы site-* идут через relay приложения — Prometheus
    # не получает секретов вообще.
    entrypoint: ["/bin/sh", "/etc/prometheus/prometheus-entrypoint.sh"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus/prometheus-entrypoint.sh:/etc/prometheus/prometheus-entrypoint.sh:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - monitoring-net
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ЭПИК-7: маршрутизация алертов Prometheus → Telegram (ADR-006).
  # Секреты TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID — из .env (никогда в git);
  # подставляются в конфиг entrypoint-скриптом при старте.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: monitoring-alertmanager
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/alertmanager-entrypoint.sh"]
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./prometheus/alertmanager-entrypoint.sh:/etc/alertmanager/alertmanager-entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitoring-net:
    name: monitoring-net

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  monitoring-db:
